<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World Map — WoW Forever: biomes, flight paths, boats &amp; zeppelins, banks &amp; auctioneers</title>
<meta name="description" content="Azeroth from the whole world down to a city street, from the game's own map art: every zone's biomes for the zone-bound item effects, flight masters with flight times and a flight planner, boats, zeppelins and skyships with sailing times, and every banker and auctioneer.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
<style>
  :root{
    --bg:#0b0906; --gold:#e0b95a; --gold-dim:#a68a3f; --parch:#efe4c8; --dim:#a89b7c; --ink:#1a1408;
    --panel:#1b1509f2; --edge-hi:#6a5630; --edge-lo:#0d0a05; --blue:#5aa9ff; --red:#ff6a5a; --teal:#6fd7c8;
    --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--parch);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;overscroll-behavior:none;}
  canvas#map{position:fixed;inset:0;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;}
  canvas#map.grabbing{cursor:grabbing;}
  .panel{background:var(--panel);border:1px solid var(--edge-hi);box-shadow:0 6px 24px rgba(0,0,0,.6),inset 0 0 0 1px var(--edge-lo);border-radius:6px;}
  #hdr{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;gap:10px;align-items:center;padding:6px 12px;
    background:linear-gradient(#2a2113f4,#1b1509f4);border-bottom:1px solid var(--edge-hi);flex-wrap:wrap;}
  #hdr .home{color:var(--dim);text-decoration:none;font-size:13px;white-space:nowrap;}
  #hdr .home:hover{color:var(--gold);}
  #hdr h1{font-family:var(--serif);font-weight:600;font-size:21px;color:var(--gold);letter-spacing:.5px;text-shadow:1px 1px 0 #000;white-space:nowrap;line-height:1;}
  #hdr .sub{font-size:12px;color:var(--dim);line-height:1.15;max-width:170px;}
  #crumb{font-family:var(--serif);font-size:14px;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;}
  #crumb span{cursor:pointer;} #crumb span:hover{color:var(--gold);} #crumb i{color:var(--dim);font-style:normal;margin:0 5px;}
  .search{position:relative;flex:1;min-width:180px;max-width:360px;}
  .search input{width:100%;font-size:14px;color:var(--parch);background:#0d0a05;border:1px solid var(--edge-hi);border-radius:4px;padding:6px 10px;outline:none;}
  .search input:focus{border-color:var(--gold);}
  .search input::placeholder{color:#6f6450;}
  .drop{position:absolute;top:100%;left:0;right:0;z-index:40;max-height:60vh;overflow-y:auto;display:none;margin-top:3px;}
  .drop div{padding:5px 10px;cursor:pointer;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;}
  .drop div:hover,.drop div.on{background:#3a2e17;color:#fff;}
  .drop div small{color:var(--dim);margin-left:6px;font-size:12px;}
  .drop .kind{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:7px;vertical-align:-2px;font-size:10px;line-height:14px;text-align:center;color:#000;font-weight:700;}
  #layers{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .chip{font-size:12.5px;color:var(--dim);background:#0d0a05;border:1px solid var(--edge-hi);border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .chip .sw{width:9px;height:9px;border-radius:2px;background:currentColor;opacity:.35;}
  .chip.on{color:var(--parch);border-color:var(--gold-dim);} .chip.on .sw{opacity:1;}
  .chip:hover{color:#fff;}
  select{font-size:13px;color:var(--parch);background:#0d0a05;border:1px solid var(--edge-hi);border-radius:4px;padding:4px 6px;outline:none;}
  #side{position:fixed;top:60px;right:10px;z-index:25;width:300px;max-height:calc(100% - 96px);overflow-y:auto;padding:12px 14px;scrollbar-width:thin;font-size:13.5px;line-height:1.4;}
  #side h2{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--gold);text-shadow:1px 1px 0 #000;margin:0 0 4px;line-height:1.15;}
  #side h3{font-family:var(--serif);font-weight:600;font-size:14.5px;color:var(--gold-dim);margin:12px 0 4px;border-bottom:1px solid var(--edge-hi);padding-bottom:2px;letter-spacing:.3px;}
  #side .kind{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
  #side .close{position:absolute;top:8px;right:10px;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;} #side .close:hover{color:#fff;}
  #side p{margin:5px 0;color:var(--parch);}
  #side .dim{color:var(--dim);font-size:12.5px;}
  #side .note{color:var(--dim);font-size:12px;line-height:1.35;border-left:2px solid var(--edge-hi);padding-left:8px;margin:6px 0;}
  #side ul{list-style:none;} #side li{padding:3px 0;border-bottom:1px solid #2a2113;}
  #side li:last-child{border-bottom:0;}
  #side .row{display:flex;gap:8px;align-items:baseline;} #side .row .n{flex:1;min-width:0;}
  #side .row .v{color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap;} #side .row .c{color:var(--dim);font-size:12px;white-space:nowrap;}
  .lnk{color:var(--parch);cursor:pointer;text-decoration:underline dotted #6a5630;} .lnk:hover{color:var(--gold);}
  .bchip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin:2px 4px 2px 0;color:#000;font-weight:600;cursor:pointer;border:1px solid #0006;}
  .bchip:hover{filter:brightness(1.15);} .bchip.off{opacity:.35;}
  .fac{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:4px;vertical-align:1px;}
  .fac.A{background:#1e4d8a;color:#cfe4ff;} .fac.H{background:#8a2a1e;color:#ffd6cf;} .fac.N{background:#6a5630;color:#ffe9b0;}
  .btn{display:inline-block;font-size:12.5px;color:var(--parch);background:#0d0a05;border:1px solid var(--edge-hi);border-radius:4px;padding:4px 10px;cursor:pointer;margin:4px 6px 2px 0;}
  .btn:hover{border-color:var(--gold);color:#fff;} .btn.on{background:#3a2e17;border-color:var(--gold-dim);}
  .legend .lg{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;} .legend .lg:hover{color:#fff;}
  .legend .lg .sw{width:14px;height:14px;border-radius:3px;border:1px solid #0008;flex:none;}
  .legend .lg small{color:var(--dim);margin-left:auto;}
  .legend .lg.off{opacity:.4;}
  #tip{position:fixed;z-index:50;display:none;pointer-events:none;padding:6px 10px;max-width:280px;font-size:13px;line-height:1.3;}
  #tip .t{color:var(--gold);font-family:var(--serif);font-size:15px;} #tip .d{color:var(--dim);font-size:12px;}
  #readout{position:fixed;right:10px;bottom:8px;z-index:22;font-size:12px;color:var(--dim);background:#0b0906cc;padding:3px 10px;border-radius:10px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  #readout b{color:var(--parch);font-weight:600;}
  #hint{position:fixed;left:10px;bottom:8px;z-index:22;font-size:12px;color:var(--dim);background:#0b0906cc;padding:3px 10px;border-radius:10px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #hint b{color:var(--gold);font-weight:600;}
  #zoomctl{position:fixed;left:10px;bottom:38px;z-index:22;display:flex;flex-direction:column;gap:4px;}
  #zoomctl button{width:30px;height:30px;font-size:18px;color:var(--parch);background:#1b1509f2;border:1px solid var(--edge-hi);border-radius:4px;cursor:pointer;}
  #zoomctl button:hover{color:var(--gold);border-color:var(--gold-dim);}
  #loading{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);}
  #loading h1{font-family:var(--serif);color:var(--gold);font-weight:600;font-size:28px;}
  #sideToggle{display:none;position:fixed;right:10px;top:60px;z-index:26;font-size:13px;color:var(--parch);background:#1b1509f2;border:1px solid var(--edge-hi);border-radius:4px;padding:5px 10px;cursor:pointer;}
  @media (max-width:820px){
    #hdr{padding:5px 8px;gap:6px;} #hdr .sub,#crumb{display:none;} .search{min-width:120px;}
    #layers{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none;padding-bottom:2px;}
    #side{width:min(300px,calc(100vw - 20px));top:auto;bottom:38px;max-height:46vh;}
    #side.hidden{display:none;} #sideToggle{display:block;top:auto;bottom:8px;right:10px;} #readout{display:none;}
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<header id="hdr">
  <a class="home" href="../../">← peligaming</a>
  <h1>World Map</h1>
  <span class="sub" id="sub">WoW Forever</span>
  <div id="crumb"></div>
  <div class="search"><input id="q" type="search" autocomplete="off" placeholder="Search zones, towns, flight masters, banks, boats…"><div id="qdrop" class="drop panel"></div></div>
  <div id="layers"></div>
  <select id="faction" title="Show what one faction can use"><option value="">Both factions</option><option value="A">Alliance</option><option value="H">Horde</option></select>
</header>
<aside id="side" class="panel"></aside>
<div id="sideToggle">Details</div>
<div id="tip" class="panel"></div>
<div id="readout"></div>
<div id="hint"><b>Scroll</b> to zoom · <b>drag</b> to pan · <b>click</b> anything to read about it</div>
<div id="zoomctl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button></div>
<div id="loading"><h1>World Map</h1><div id="loadmsg">Unrolling the map…</div></div>

<script>
(function () {
"use strict";
const DATA_URL = "data/world-map/world-map.json";
const $ = (id) => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

// ---- state -----------------------------------------------------------------
const LAYERS = [
  { key: "biomes", name: "Biomes", color: "#5fae4a" },
  { key: "flights", name: "Flight masters", color: "#ffd25a" },
  { key: "routes", name: "Flight paths", color: "#ffd25a" },
  { key: "transports", name: "Boats & zeppelins", color: "#6fd7ff" },
  { key: "banks", name: "Banks", color: "#e0b95a" },
  { key: "auction", name: "Auction houses", color: "#9fe36f" },
  { key: "places", name: "Towns & dungeons", color: "#efe4c8" },
];
const state = {
  view: { cx: 501, cy: 334, z: 1 },
  layers: { biomes: true, flights: true, routes: false, transports: true, banks: true, auction: true, places: true },
  faction: "",
  biomeFocus: null,      // biome key or null
  hover: null, sel: null,
  plan: { from: null, to: null, result: null },
  legacyTransports: false,
};
let D = null;            // the dataset
let mapsById = new Map(), nodesById = new Map(), routesFrom = new Map(), biomesByKey = new Map();
let hits = [];           // hit-test targets rebuilt every frame
let dirty = true, animating = false;
const images = new Map();      // map.id -> HTMLImageElement
const masked = new Map();      // map.id -> masked canvas (LRU)
const MASK_LRU = 22;
const patterns = new Map();

// ---- helpers ---------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtTime = (s) => { s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return m ? `${m}:${String(r).padStart(2, "0")}` : `${r}s`; };
const fmtMoney = (c) => { const g = Math.floor(c / 10000), s = Math.floor((c % 10000) / 100), cp = c % 100; const p = []; if (g) p.push(g + "g"); if (s || g) p.push(s + "s"); if (cp || (!g && !s)) p.push(cp + "c"); return p.join(" "); };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const facName = { A: "Alliance", H: "Horde", N: "Neutral" };
const facColor = { A: "#5aa9ff", H: "#ff6a5a", N: "#ffd25a" };
const toScreen = (fx, fy) => [(fx - state.view.cx) * state.view.z + W / 2, (fy - state.view.cy) * state.view.z + H / 2];
const toFrame = (sx, sy) => [(sx - W / 2) / state.view.z + state.view.cx, (sy - H / 2) / state.view.z + state.view.cy];
const topBar = () => $("hdr").offsetHeight || 0;
const fitZoom = () => Math.min(W / D.frame.width, (H - topBar()) / D.frame.height) * 0.98;
const usable = (f) => !state.faction || !f || f === "N" || f === state.faction;
const npcUsable = (n) => !state.faction || !n.react || (state.faction === "A" ? n.react[0] : n.react[1]) !== -1;
function pointInRing(ring, x, y) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const inRect = (r, x, y) => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3];
function centroid(ring) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = ring.length; i < n; i++) {
    const [x1, y1] = ring[i], [x2, y2] = ring[(i + 1) % n];
    const f = x1 * y2 - x2 * y1; a += f; cx += (x1 + x2) * f; cy += (y1 + y2) * f;
  }
  if (!a) return ring[0];
  return [cx / (3 * a), cy / (3 * a)];
}
function zoneAt(fx, fy) {
  let best = null;
  for (const m of D.maps) {
    if (m.kind !== "zone" && m.kind !== "city") continue;
    if (!inRect(m.rect, fx, fy)) continue;
    if (m.outline && m.outline.length) { if (m.outline.some((r) => pointInRing(r, fx, fy))) { if (!best || m.kind === "city") best = m; } }
    else if (m.kind === "city" && !best) best = m;
  }
  return best;
}
function subzoneAt(m, fx, fy) {
  if (!m || !m.subzones) return null;
  for (const s of m.subzones) if (s.poly && s.poly.some((r) => pointInRing(r, fx, fy))) return s;
  return null;
}

// ---- data ------------------------------------------------------------------
async function load() {
  D = await (await fetch(DATA_URL)).json();
  $("sub").textContent = `WoW Forever · beta build ${D.build}`;
  for (const m of D.maps) {
    mapsById.set(m.id, m);
    if (m.outline && m.outline.length) m.center = centroid(m.outline[0]);
    else m.center = [(m.rect[0] + m.rect[2]) / 2, (m.rect[1] + m.rect[3]) / 2];
    m.area2 = (m.rect[2] - m.rect[0]) * (m.rect[3] - m.rect[1]);
  }
  for (const n of D.taxi.nodes) { nodesById.set(n.id, n); routesFrom.set(n.id, []); }
  for (const r of D.taxi.routes) routesFrom.get(r.from)?.push(r);
  for (const b of D.biomes) biomesByKey.set(b.key, b);
  for (const t of D.transports) t.center = t.stops[0]?.at;
  buildSearch();
  buildLayers();
  readHash();
  if (!state.view.hashed) { state.view.z = fitZoom(); state.view.cx = D.frame.width / 2; state.view.cy = D.frame.height / 2 - topBar() / 2 / state.view.z; }
  showAbout();
  if (window.innerWidth <= 820) side.classList.add("hidden"); // phones: the map first, details on demand
  $("loading").style.display = "none";
  requestDraw();
}

// ---- images ----------------------------------------------------------------
function imageFor(m) {
  if (!m.img) return null;
  let img = images.get(m.id);
  if (!img) {
    img = new Image();
    img.onload = () => requestDraw();
    img.src = "data/world-map/" + m.img;
    images.set(m.id, img);
  }
  return img.complete && img.naturalWidth ? img : null;
}
function maskedFor(m, img, soft) {
  const key = m.id + (soft ? ":soft" : ":clip");
  let c = masked.get(key);
  if (c) { masked.delete(key); masked.set(key, c); return c; }
  const Wi = img.naturalWidth, Hi = img.naturalHeight;
  c = document.createElement("canvas"); c.width = Wi; c.height = Hi;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = "destination-in";
  const [x0, y0, x1, y1] = m.rect;
  const sx = Wi / (x1 - x0), sy = Hi / (y1 - y0);
  try { g.filter = m.kind === "zone" ? "blur(3px)" : "blur(18px)"; } catch (e) { /* no filter support: hard edges */ }
  g.fillStyle = "#000"; g.strokeStyle = "#000"; g.lineJoin = "round";
  if (!soft && m.kind === "zone" && m.outline && m.outline.length) {
    g.beginPath();
    for (const ring of m.outline) { ring.forEach(([x, y], i) => { const px = (x - x0) * sx, py = (y - y0) * sy; if (i) g.lineTo(px, py); else g.moveTo(px, py); }); g.closePath(); }
    g.fill(); g.lineWidth = 16; g.stroke();
  } else {
    const inset = m.kind === "continent" ? 40 : 26;
    g.fillRect(inset, inset, Wi - inset * 2, Hi - inset * 2);
  }
  masked.set(key, c);
  if (masked.size > MASK_LRU) masked.delete(masked.keys().next().value);
  return c;
}
function drawMapImage(m, alpha, mode) {
  const img = imageFor(m);
  if (!img) return;
  const [x0, y0, x1, y1] = m.rect;
  const [sx0, sy0] = toScreen(x0, y0), [sx1, sy1] = toScreen(x1, y1);
  if (sx1 < -50 || sy1 < -50 || sx0 > W + 50 || sy0 > H + 50) return;
  ctx.globalAlpha = alpha;
  ctx.drawImage(mode ? maskedFor(m, img, mode === "soft") : img, sx0, sy0, sx1 - sx0, sy1 - sy0);
  ctx.globalAlpha = 1;
}
function biomePattern(keys, strong) {
  const id = keys.join("+") + (strong ? "!" : "");
  let p = patterns.get(id);
  if (p) return p;
  const c = document.createElement("canvas"); c.width = c.height = 14 * keys.length;
  const g = c.getContext("2d");
  const cols = keys.map((k) => biomesByKey.get(k).color);
  if (keys.length === 1) { g.fillStyle = cols[0]; g.fillRect(0, 0, c.width, c.height); }
  else {
    // diagonal bands, one per biome
    g.translate(c.width / 2, c.height / 2); g.rotate(-Math.PI / 4); g.translate(-c.width, -c.height);
    const band = 14;
    for (let i = -6; i < 12; i++) { g.fillStyle = cols[((i % keys.length) + keys.length) % keys.length]; g.fillRect(-c.width, i * band, c.width * 4, band); }
  }
  p = ctx.createPattern(c, "repeat");
  patterns.set(id, p);
  return p;
}

// ---- drawing ---------------------------------------------------------------
function requestDraw() { dirty = true; if (!animating) { animating = true; requestAnimationFrame(frame); } }
function frame() { animating = false; if (dirty) { dirty = false; draw(); } }
function fade(z, a, b) { return clamp((z - a) / (b - a), 0, 1); }
function path(ring, close) {
  ring.forEach(([x, y], i) => { const [sx, sy] = toScreen(x, y); if (i) ctx.lineTo(sx, sy); else ctx.moveTo(sx, sy); });
  if (close) ctx.closePath();
}
function label(text, sx, sy, size, color, opts = {}) {
  ctx.font = `${opts.weight || 600} ${size}px ${opts.serif === false ? '"Segoe UI",system-ui,sans-serif' : 'var(--serif)'}`.replace("var(--serif)", '"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif');
  ctx.textAlign = opts.align || "center"; ctx.textBaseline = opts.base || "middle";
  try { ctx.letterSpacing = (opts.spacing || 0) + "px"; } catch (e) { /* older browsers */ }
  ctx.lineWidth = Math.max(2, size / 4); ctx.strokeStyle = "rgba(10,7,3,.85)"; ctx.lineJoin = "round";
  ctx.strokeText(text, sx, sy); ctx.fillStyle = color; ctx.fillText(text, sx, sy);
  try { ctx.letterSpacing = "0px"; } catch (e) { /* ignore */ }
}
function visibleRect(pad) { const [x0, y0] = toFrame(-pad, -pad), [x1, y1] = toFrame(W + pad, H + pad); return [x0, y0, x1, y1]; }
const rectsOverlap = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];

function draw() {
  if (!D) return;
  const z = state.view.z;
  hits = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#0b0906"; ctx.fillRect(0, 0, W, H);
  const vis = visibleRect(80);

  // 1. art, coarse to fine
  const world = D.maps.find((m) => m.kind === "world");
  if (world) drawMapImage(world, 1, null);
  const conts = D.maps.filter((m) => m.kind === "continent");
  const zones = D.maps.filter((m) => m.kind === "zone").sort((a, b) => b.area2 - a.area2);
  const cities = D.maps.filter((m) => m.kind === "city");
  const aCont = fade(z, 1.5, 2.4), aZone = fade(z, 3.6, 5.2), aCity = fade(z, 16, 24);
  if (aCont > 0) for (const m of conts) if (rectsOverlap(m.rect, vis)) drawMapImage(m, aCont, "soft");
  // each zone's map paints its surroundings too: lay those down softly first, then every zone clipped to its own outline on top

// ---- flight planner --------------------------------------------------------
function planFlight(from, to) {
  const dist = new Map([[from.id, 0]]), prev = new Map(), done = new Set();
  const pq = [[0, from.id]];
  while (pq.length) {
    pq.sort((a, b) => a[0] - b[0]);
    const [d, id] = pq.shift();
    if (done.has(id)) continue; done.add(id);
    if (id === to.id) break;
    for (const r of routesFrom.get(id) || []) {
      const n = nodesById.get(r.to); if (!usable(n.faction)) continue;
      const nd = d + r.seconds;
      if (nd < (dist.get(r.to) ?? Infinity)) { dist.set(r.to, nd); prev.set(r.to, r); pq.push([nd, r.to]); }
    }
  }
  if (!dist.has(to.id)) return { none: true, from, to };
  const routes = []; let cur = to.id;
  while (cur !== from.id) { const r = prev.get(cur); routes.unshift(r); cur = r.from; }
  return { from, to, routes, seconds: dist.get(to.id), cost: routes.reduce((s, r) => s + r.cost, 0) };
}
function planHtml() {
  const p = state.plan;
  if (!p.from && !p.to) return `<p class="dim">Pick a start and a destination to plan a flight across the network.</p>`;
  let html = `<h3>Flight plan</h3><p>${p.from ? `<span class="lnk" data-node="${p.from.id}">${esc(p.from.name)}</span>` : "<span class='dim'>start?</span>"} → ${p.to ? `<span class="lnk" data-node="${p.to.id}">${esc(p.to.name)}</span>` : "<span class='dim'>destination?</span>"} <span class="lnk dim" data-clearplan>clear</span></p>`;
  const r = p.result;
  if (r && r.none) html += `<p class="dim">No connection between those two for ${state.faction ? facName[state.faction] : "either faction"}.</p>`;
  else if (r) html += `<ul>${r.routes.map((x) => `<li class="row"><span class="n">${esc(nodesById.get(x.from).name)} → ${esc(nodesById.get(x.to).name)}</span><span class="v">${fmtTime(x.seconds)}</span><span class="c">${fmtMoney(x.cost)}</span></li>`).join("")}</ul><p><b>${fmtTime(r.seconds)}</b> in the air, <b>${fmtMoney(r.cost)}</b>, ${r.routes.length} leg${r.routes.length === 1 ? "" : "s"}. Shortest by time; the game strings hops into one flight, though its own choice of hops can differ.</p>`;
  return html;
}

const q = $("q"), qdrop = $("qdrop");
let qResults = [], qIdx = -1;
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  if (!s) { qdrop.style.display = "none"; return; }
  const starts = [], contains = [];
  for (const it of searchIndex) { const l = it.label.toLowerCase(); if (l.startsWith(s)) starts.push(it); else if (l.includes(s) || it.sub.toLowerCase().includes(s)) contains.push(it); }
  const rank = { zone: 0, flight: 1, boat: 2, zeppelin: 2, airship: 2, bank: 3, auction: 3, dungeon: 4, place: 5 };
  const byRank = (a, b) => (rank[a.kind] ?? 9) - (rank[b.kind] ?? 9);
  qResults = starts.sort(byRank).concat(contains.sort(byRank)).slice(0, 14); qIdx = -1;
  qdrop.innerHTML = qResults.map((it, i) => `<div data-i="${i}"><span class="kind" style="background:${it.color}">${it.kind[0].toUpperCase()}</span>${esc(it.label)}<small>${esc(it.sub)}</small></div>`).join("") || `<div class="dim">nothing by that name</div>`;
  qdrop.style.display = "block";

function pick(i) { const it = qResults[i]; if (!it) return; qdrop.style.display = "none"; q.value = it.label; q.blur(); it.go(); }
q.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { qIdx = Math.min(qIdx + 1, qResults.length - 1); e.preventDefault(); }
  else if (e.key === "ArrowUp") { qIdx = Math.max(qIdx - 1, 0); e.preventDefault(); }
  else if (e.key === "Enter") { pick(qIdx < 0 ? 0 : qIdx); return; }

q.addEventListener("blur", () => setTimeout(() => { qdrop.style.display = "none"; }, 150));

let hashTimer = null;

    const parts = [`v=${v.cx.toFixed(1)},${v.cy.toFixed(1)},${v.z.toFixed(2)}`, `l=${on}`];
    if (state.faction) parts.push(`f=${state.faction}`);

}
function readHash() {

  if (h.has("l")) { const on = new Set(h.get("l").split(",")); for (const l of LAYERS) state.layers[l.key] = on.has(l.key); buildLayers(); }
  if (h.get("f")) { state.faction = h.get("f"); $("faction").value = state.faction; }
  if (h.get("b") && biomesByKey.has(h.get("b"))) state.biomeFocus = h.get("b");
}

load().catch((e) => { $("loadmsg").textContent = "The map could not be loaded: " + e.message; console.error(e); });
})();
</script>
