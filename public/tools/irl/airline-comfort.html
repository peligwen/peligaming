<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Airline Comfort Visualizer — a 737 MAX 8 in rough air, from outside and from the aisle</title>
  <meta name="description" content="Play god with a Boeing 737 MAX 8 at 15,000 feet: pitch, roll and yaw it up to 45°, hit it with downdrafts and turbulence, and watch what the physics does — and does not do — to the passengers, the drinks, the bags and the overhead bins, from outside and from inside the cabin looking down the aisle. No words: just the plane.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d1117;
      --panel: rgba(22, 27, 34, 0.88);
      --panel-solid: #161b22;
      --panel-border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --brand: #58a6ff;
      --accent: #f2c94c;
      --good: #3fb950;
      --warn: #e3b341;
      --bad: #f85149;
      --panel-h: 168px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      overscroll-behavior: none; touch-action: none;
    }
    button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; cursor: pointer; touch-action: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    button:hover { border-color: var(--brand); }
    button svg { display: block; width: 100%; height: 100%; }
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--brand); }

    #view, #hud { position: fixed; left: 0; top: 0; width: 100%; height: calc(100% - var(--panel-h) - var(--safe-bottom)); display: block; }
    #view { touch-action: none; cursor: grab; background: #6f9fd8; }
    #view.dragging { cursor: grabbing; }
    #hud { pointer-events: none; }

    /* ---- top row: the way home, the view and the reset ---- */
    .top {
      position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 6px; pointer-events: none;
      padding: calc(8px + var(--safe-top)) calc(10px + var(--safe-right)) 0 calc(10px + var(--safe-left));
    }
    .top > * { pointer-events: auto; }
    .top a, .top button { width: 40px; height: 40px; padding: 8px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text); background: var(--panel); border: 1px solid var(--panel-border); }
    .top a:hover { border-color: var(--brand); }
    .top a svg { width: 100%; height: 100%; display: block; }
    .spacer { flex: 1; pointer-events: none; }

    /* ---- the god's panel ---- */
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--panel-h) + var(--safe-bottom));
      padding: 8px calc(8px + var(--safe-right)) calc(6px + var(--safe-bottom)) calc(8px + var(--safe-left));
      background: linear-gradient(rgba(13, 17, 23, 0.85), rgba(13, 17, 23, 0.97)); border-top: 1px solid var(--panel-border);
      display: grid; grid-template-columns: 154px 1fr 154px; gap: 8px; align-items: stretch; touch-action: none;
    }
    .pad { position: relative; border-radius: 14px; background: rgba(22, 27, 34, 0.9); border: 1px solid var(--panel-border); touch-action: none; overflow: hidden; }
    .pad svg.face { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .pad .knob {
      position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px; left: 50%; top: 50%; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 35% 35%, #8fb9ff, #2f6fd1 65%, #1b3f80); border: 2px solid rgba(255,255,255,0.35); box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .pad .knob svg { width: 30px; height: 30px; }
    .pad.right .knob { background: radial-gradient(circle at 35% 35%, #ffe28a, #d9a334 65%, #7a5a14); }
    .mid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 6px; min-width: 0; min-height: 0; }
    .mid button { padding: 6px 10px; min-width: 0; min-height: 0; position: relative; }
    .mid button svg { max-height: 100%; margin: 0 auto; width: auto; }
    .mid button.on { border-color: var(--accent); }
    .mid button .lamp { position: absolute; right: 7px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: #2a2f36; box-shadow: inset 0 1px 1px rgba(0,0,0,0.7); }
    .mid button.on .lamp { background: var(--accent); box-shadow: 0 0 7px var(--accent); }
    .mid button.pulse { border-color: var(--bad); }
    .mid button.danger:hover { border-color: var(--bad); }
    @media (max-width: 700px) {
      :root { --panel-h: 150px; }
      #panel { grid-template-columns: 132px 1fr 132px; gap: 6px; }
      .pad .knob { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
      .mid button { padding: 4px 6px; }
    }
    @media (max-width: 520px) {
      :root { --panel-h: 172px; }
      #panel { grid-template-columns: 104px 1fr 104px; gap: 6px; }
      .mid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
      .mid button { padding: 3px 5px; border-radius: 8px; }
      .mid button .lamp { right: 4px; top: 4px; width: 6px; height: 6px; }
      .pad .knob { width: 38px; height: 38px; margin: -19px 0 0 -19px; }
      .pad .knob svg { width: 24px; height: 24px; }
    }
    @media (max-height: 420px) { :root { --panel-h: 128px; } .pad .knob { width: 40px; height: 40px; margin: -20px 0 0 -20px; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="hud"></canvas>

  <div class="top">
    <a href="../../" aria-label="peligaming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg></a>
    <span class="spacer"></span>
    <button id="btnView" aria-label="outside view or cabin view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icoView"><path d="M2.5 16.5 10 13V5.5a2 2 0 0 1 4 0V13l7.5 3.5V19L14 17.5V20l2 1.5V23l-4-1-4 1v-1.5l2-1.5v-2.5L2.5 19z"/></svg></button>
    <button id="btnRecenter" aria-label="recenter the view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  </div>

  <div id="panel">
    <div class="pad left" id="padAtt" aria-label="pitch and roll">
      <svg class="face" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line x1="50" y1="6" x2="50" y2="94" stroke="rgba(255,255,255,0.10)" stroke-width="0.7"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="rgba(255,255,255,0.10)" stroke-width="0.7"/>
        <g stroke="rgba(255,255,255,0.22)" stroke-width="0.8" fill="none">
          <path d="M50 7 l3 5 h-6z"/><path d="M50 93 l3 -5 h-6z"/>
          <path d="M7 50 l5 -3 v6z"/><path d="M93 50 l-5 -3 v6z"/>
        </g>
      </svg>
      <div class="knob"><svg viewBox="0 0 24 24" fill="#0b1b36"><path d="M2.5 16.5 10 13V5.5a2 2 0 0 1 4 0V13l7.5 3.5V19L14 17.5V20l2 1.5V23l-4-1-4 1v-1.5l2-1.5v-2.5L2.5 19z"/></svg></div>
    </div>
    <div class="mid">
      <button id="btnLevel" aria-label="wings level, nose on the horizon"><svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16h12M33 16h12"/><path d="M18 16h12"/><path d="M24 9v14"/><circle cx="24" cy="16" r="3" fill="currentColor" stroke="none"/><path d="M12 7l-2.5 2.5M36 7l2.5 2.5"/></svg></button>
      <button id="btnBelt" aria-label="fasten seat belts sign"><span class="lamp"></span><svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="6" r="3.2"/><path d="M14 30v-9a6 6 0 0 1 6-6h1a6 6 0 0 1 6 6v9"/><path d="M27 21h7a4 4 0 0 1 4 4v5"/><path d="M9 20l12 8M33 20l-12 8"/><rect x="18.5" y="22" width="5" height="5" rx="1" fill="currentColor" stroke="none"/></svg></button>
      <button id="btnTurb" aria-label="continuous turbulence"><span class="lamp"></span><svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c4-5 8-5 12 0s8 5 12 0 8-5 12 0"/><path d="M4 18c4-5 8-5 12 0s8 5 12 0 8-5 12 0"/><path d="M4 26c4-5 8-5 12 0s8 5 12 0 8-5 12 0"/></svg></button>
      <button id="btnJolt1" aria-label="a small downdraft"><svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a6 6 0 0 1 6-6 7 7 0 0 1 13 2 5 5 0 0 1 2 9.5H14A4.5 4.5 0 0 1 12 15z"/><path d="M24 23v6M21 26.5l3 3 3-3"/></svg></button>
      <button id="btnJolt2" class="danger" aria-label="a severe downdraft"><svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a7 7 0 0 1 7-7 9 9 0 0 1 17 2.5A6 6 0 0 1 34 19H11a5 5 0 0 1-3-7z"/><path d="M16 22v8M13 26.5l3 3.5 3-3.5"/><path d="M24 21v9M21 26.5l3 3.5 3-3.5"/><path d="M32 22v8M29 26.5l3 3.5 3-3.5"/></svg></button>
      <button id="btnJolt3" aria-label="an updraft"><svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 24a6 6 0 0 1 6 -6 7 7 0 0 1 13 -2 5 5 0 0 1 2 -9.5H14A4.5 4.5 0 0 1 12 24z" transform="translate(0 2) scale(1 -1) translate(0 -32)"/><path d="M24 9V3M21 5.5l3-3 3 3"/></svg></button>
    </div>
    <div class="pad right" id="padYaw" aria-label="yaw, and the roughness of the air">
      <svg class="face" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line x1="50" y1="6" x2="50" y2="94" stroke="rgba(255,255,255,0.10)" stroke-width="0.7"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="rgba(255,255,255,0.10)" stroke-width="0.7"/>
        <g stroke="rgba(255,255,255,0.22)" stroke-width="0.8" fill="none">
          <path d="M7 50 l5 -3 v6z"/><path d="M93 50 l-5 -3 v6z"/>
          <path d="M44 8c2-3 10-3 12 0M42 13c3-4 13-4 16 0M40 18c4-5 16-5 20 0" />
        </g>
      </svg>
      <div class="knob"><svg viewBox="0 0 24 24" fill="#3a2a05"><path d="M2.5 16.5 10 13V5.5a2 2 0 0 1 4 0V13l7.5 3.5V19L14 17.5V20l2 1.5V23l-4-1-4 1v-1.5l2-1.5v-2.5L2.5 19z"/></svg></div>
    </div>
  </div>

  <script id="cabin-engine">
  // ======================================================================
  // AIRLINER — a Boeing 737 MAX 8 in the hands of a god, and the cabin
  // that has to live with it.
  //
  // A pure function of state and time, no DOM: the page steps it every
  // frame and scripts/check-airline.mjs runs it under Node. Everything is
  // SI; angles are radians. World: x east, y up, z south (three.js).
  // Body: x forward, y up, z right; the identity attitude faces east.
  //
  // The god sets an attitude — pitch and roll against the horizon, and a
  // heading offset from the heading the flight path would be following —
  // and the hand that moves the aeroplane to it has an airliner's own
  // control authority (rates and accelerations), no more. Everything else
  // is aerodynamics: lift from the angle between the body and the air it
  // is actually moving through, drag, side force from sideslip, a thrust
  // that was trimmed for level flight and is never touched again, and
  // gravity. Pitch down and the speed builds; pull up and it bleeds, then
  // the wing stalls; bank and the lift tilts and the aeroplane turns at
  // the rate that bank buys, loading everyone straight down into their
  // seats; yaw and the fuselage shoulders the air until the flight path
  // comes round to the nose. "Air pockets" are what they really are:
  // vertical gusts that change the angle of attack for a second or two.
  //
  // The cabin is a rigid box riding on the aeroplane's centre of mass.
  // Every loose thing in it — a passenger out of their seat, a cup on a
  // tray, a bag on a shelf, a cart in the aisle — moves under the specific
  // force at its own place in that box: the aeroplane's acceleration, the
  // angular acceleration times the arm, the centripetal term, and gravity,
  // all expressed in the frame of the walls it will hit.
  // ======================================================================
  const AIRLINER = (() => {
    'use strict';
    const D2R = Math.PI / 180, R2D = 180 / Math.PI, G = 9.80665, TAU = Math.PI * 2;
    const KT = 0.514444, FT = 0.3048;

    // ---------------------------------------------------------- vectors & quaternions
    const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    const scale = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const norm = (a) => Math.hypot(a[0], a[1], a[2]);
    const unit = (a) => { const n = norm(a); return n > 1e-12 ? scale(a, 1 / n) : [0, 0, 0]; };
    const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
    const wrap = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
    const qmul = (a, b) => [
      a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
      a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
      a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
      a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
    ];
    const qaxis = (axis, ang) => { const s = Math.sin(ang / 2); return [axis[0] * s, axis[1] * s, axis[2] * s, Math.cos(ang / 2)]; };
    const qnorm = (q) => { const n = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / n, q[1] / n, q[2] / n, q[3] / n]; };
    const qconj = (q) => [-q[0], -q[1], -q[2], q[3]];
    function qrot(q, v) {
      const x = q[0], y = q[1], z = q[2], w = q[3];
      const ix = w * v[0] + y * v[2] - z * v[1], iy = w * v[1] + z * v[0] - x * v[2], iz = w * v[2] + x * v[1] - y * v[0], iw = -x * v[0] - y * v[1] - z * v[2];
      return [ix * w + iw * -x + iy * -z - iz * -y, iy * w + iw * -y + iz * -x - ix * -z, iz * w + iw * -z + ix * -y - iy * -x];
    }
    const qinv = (q, v) => qrot(qconj(q), v);
    // heading clockwise from north, pitch up, roll right-wing-down
    const qfromEuler = (heading, pitch, roll) => qmul(qmul(qaxis([0, 1, 0], Math.PI / 2 - heading), qaxis([0, 0, 1], pitch)), qaxis([1, 0, 0], roll));
    function qtoEuler(q) {
      const f = qrot(q, [1, 0, 0]), u = qrot(q, [0, 1, 0]), r = qrot(q, [0, 0, 1]);
      return { heading: (Math.atan2(f[0], -f[2]) + TAU) % TAU, pitch: Math.asin(clamp(f[1], -1, 1)), roll: Math.atan2(-r[1], u[1]) };
    }
    // the rotation that takes q to qt, as a vector in the body frame (axis × angle, shortest way)
    function qerror(q, qt) {
      let e = qmul(qconj(qt), q);
      if (e[3] < 0) e = [-e[0], -e[1], -e[2], -e[3]];
      const s = Math.hypot(e[0], e[1], e[2]);
      if (s < 1e-9) return [0, 0, 0];
      const ang = 2 * Math.atan2(s, e[3]);
      return [e[0] / s * ang, e[1] / s * ang, e[2] / s * ang];
    }
    // a seeded generator, so a check script sees the same cabin every run
    function rng(seed) {
      let a = seed >>> 0;
      const next = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      next.gauss = () => { let u = 0, v = 0; while (u === 0) u = next(); while (v === 0) v = next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
      next.range = (a, b) => a + (b - a) * next();
      next.int = (n) => Math.floor(next() * n);
      return next;
    }

    // ---------------------------------------------------------- the aeroplane
    const P = {
      mass: 70000,            // kg, a mid-weight MAX 8 (MTOW 82 t, empty 45 t)
      S: 127, span: 35.9,     // wing area m², span m (with the winglets)
      CL0: 0.30, CLa: 5.0,    // lift at zero body angle (incidence and camber), lift slope per rad
      aStall: 14 * D2R,       // flaps up
      CD0: 0.021, k: 0.040,   // parasite drag, induced drag factor (AR 10, e 0.8)
      CYb: 0.7, CYc: 0.7,     // side force: linear with sideslip, then cross-flow on the fuselage
      CDb: 0.6,               // drag from sideslip (the fuselage broadside)
      alt: 15000 * FT, rho: 0.771, rho0: 1.225, a: 322, // 15,000 ft: density, sea-level density, speed of sound
      V0: 150,                // m/s true, about 230 kt indicated: a typical speed at 15,000 ft
      Vmo: 340 * KT, Mmo: 0.82, // indicated; the barber pole
      // the god's hand has an airliner's control authority: these are roughly a 737's full-deflection rates
      rate: [20 * D2R, 8 * D2R, 4 * D2R], acc: [30 * D2R, 10 * D2R, 6 * D2R], // roll (x), yaw (y), pitch (z)
      gainAtt: 1.2, tauRate: 0.35, maxAngle: 45 * D2R,
      // the cabin, in the body frame (metres from the centre of mass)
      cabin: {
        xFront: 15.5, xRear: -13.5, floor: -1.0, height: 2.2, binBottom: 1.6, seatPan: 0.45, seatTop: 1.15, tray: 0.68, halfW: 1.77, aisleHalf: 0.25,
        rows: 31, pitch: 0.787, row0x: 13.5, seatZ: [-1.35, -0.91, -0.47, 0.47, 0.91, 1.35],
        headSeated: 0.80, headStanding: 1.62, headR: 0.11,
      },
    };

    // ---------------------------------------------------------- gusts
    // One discrete gust is the certification shape: half a cosine wave up to
    // the peak and back, 1.6 s long at this speed (120 m to the peak).
    function gustAt(s) {
      let w = 0, v = 0;
      for (const j of s.jolts) {
        const t = s.t - j.t0;
        if (t >= 0 && t <= j.T) w += j.w * 0.5 * (1 - Math.cos(TAU * t / j.T));
      }
      w += s.turb.w; v += s.turb.v;
      return { w, v }; // w up, v to the right of the flight path, m/s
    }
    // Continuous turbulence: Dryden-flavoured. Two cascaded first-order
    // filters on white noise give the vertical and lateral gusts their
    // spectrum (scale length 300 m), a faster filter gives the chop, and a
    // small rolling and yawing disturbance stands in for the gust gradient
    // across the span. σ_w: 0 to 12 m/s with the slider, squared so the low
    // end is fine: light chop around 0.4, moderate at 0.6, severe at 0.8,
    // and the top of the scale is the violent kind.
    function stepTurb(s, dt) {
      const T = s.turb, I = s.turb.intensity, sig = 12 * I * I;
      const V = Math.max(60, s.info.V || P.V0);
      const tau1 = 300 / V, tau2 = 0.4;
      const a1 = Math.exp(-dt / tau1), a2 = Math.exp(-dt / tau2);
      const k1 = Math.sqrt(1 - a1 * a1), k2 = Math.sqrt(1 - a2 * a2);
      // w1 and v1 are unit-variance first-order noise; w2 and v2 are those low-passed again (std 0.70), so the sum below has about unit variance
      T.w1 = a1 * T.w1 + k1 * s.rand.gauss(); T.w2 = a1 * T.w2 + (1 - a1) * T.w1;
      T.v1 = a1 * T.v1 + k1 * s.rand.gauss(); T.v2 = a1 * T.v2 + (1 - a1) * T.v1;
      T.c1 = a2 * T.c1 + k2 * s.rand.gauss(); T.c2 = a2 * T.c2 + k2 * s.rand.gauss();
      // most of the energy in the chop: the aeroplane's own heave rides out the slow swells (its time constant is about two seconds) but not the fast ones
      T.w = sig * (0.9 * T.w2 + 0.75 * T.c1);
      T.v = sig * 0.7 * (0.9 * T.v2 + 0.5 * T.c2);
      T.p = a2 * T.p + k2 * s.rand.gauss(); T.r = a2 * T.r + k2 * s.rand.gauss();
    }

    // ---------------------------------------------------------- aerodynamics & the hand
    function stepAircraft(s, dt) {
      const C = P.cabin, q = s.q;
      // the air the aeroplane is moving through
      const g = gustAt(s);
      const velH = [s.vel[0], 0, s.vel[2]];
      const fwdH = unit(velH[0] || velH[2] ? velH : qrot(q, [1, 0, 0]));
      const rightH = [-fwdH[2], 0, fwdH[0]]; // to the right of the flight path (world x east, z south)
      const gustW = add(scale([0, 1, 0], g.w), scale(rightH, g.v));
      const relW = sub(s.vel, gustW);        // the aeroplane's velocity through the air, world frame
      const relB = qinv(q, relW);            // ... in the body frame
      const V = Math.max(1, norm(relB));
      const u = relB[0], wb = relB[1], vb = relB[2];
      const alpha = Math.atan2(-wb, Math.max(1, u));     // relative wind from below → positive
      const beta = Math.asin(clamp(vb / V, -1, 1));       // relative wind from the right → positive
      const qbar = 0.5 * P.rho * V * V;
      // lift: linear to the stall, then the wing lets go — a gentle break
      // down to a flat-plate-ish plateau, so a stalled aeroplane mushes
      let CL;
      const aEff = alpha;
      if (Math.abs(aEff) <= P.aStall) CL = P.CL0 + P.CLa * aEff;
      else {
        const sgn = Math.sign(aEff), over = Math.abs(aEff) - P.aStall;
        const CLs = P.CL0 * sgn + P.CLa * P.aStall * sgn;
        CL = CLs * (0.55 + 0.45 * Math.exp(-over / (6 * D2R))) * Math.cos(over);
      }
      const stallDepth = clamp((Math.abs(alpha) - P.aStall * 0.85) / (P.aStall * 0.3), 0, 1); // buffet begins just before the stall
      // past the stall the whole airframe is a bluff body to the flow: cross-flow drag that is nothing below the stall and a flat plate's well above it
      const sa = Math.sin(alpha), bluff = 1.2 * sa * sa * (1 - Math.exp(-Math.pow(Math.abs(alpha) / P.aStall, 4)));
      const CD = P.CD0 + P.k * CL * CL + P.CDb * Math.sin(beta) * Math.sin(beta) + 0.12 * stallDepth + bluff;
      const CY = -(P.CYb * Math.sin(beta) * Math.cos(beta) + P.CYc * Math.sin(beta) * Math.abs(Math.sin(beta)));
      const L = CL * qbar * P.S, D = CD * qbar * P.S, Y = CY * qbar * P.S;
      // lift is the body's up made perpendicular to the relative wind (so it leans forward of body-up by the angle of attack); drag is along the wind
      const vhat = unit(relB);
      const liftB = unit(sub([0, 1, 0], scale(vhat, vhat[1])));
      const dragB = scale(vhat, -1);
      let FB = add(add(scale(liftB, L), scale(dragB, D)), [P.thrust, 0, Y]);
      // stall buffet: the separated wake shakes the airframe
      if (stallDepth > 0) {
        const sh = stallDepth * 0.8 * s.rand.gauss();
        FB = add(FB, [0, sh * 0.25 * P.mass, 0]);
      }
      // high-speed buffet past the barber pole
      const ias = V * Math.sqrt(P.rho / P.rho0), mach = V / P.a;
      const over = Math.max(0, (ias - P.Vmo) / (20 * KT), (mach - P.Mmo) / 0.04);
      if (over > 0) FB = add(FB, [0, Math.min(1, over) * 0.12 * P.mass * s.rand.gauss(), 0]);
      const FW = add(qrot(q, FB), [0, -P.mass * G, 0]);
      const aW = scale(FW, 1 / P.mass);
      // the god's hand: an attitude the aeroplane is driven to, at an airliner's own rates
      const eul = qtoEuler(q);
      const psiVel = Math.atan2(relW[0], -relW[2]);
      // the heading the flight path turns at in this bank, as a coordinated turn would — the reference the yaw command is laid on
      const turnRate = G * Math.tan(clamp(eul.roll, -1.2, 1.2)) / Math.max(60, V);
      s.psiRef += turnRate * dt;
      s.psiRef += wrap(psiVel - s.cmd.yaw - s.psiRef) * dt / 20; // and it drifts slowly back onto the flight path
      const qt = qfromEuler(s.psiRef + s.cmd.yaw, s.cmd.pitch, s.cmd.roll);
      const err = qerror(q, qt);
      const omegaDes = [0, 0, 0], alphaDot = [0, 0, 0];
      for (let i = 0; i < 3; i++) {
        omegaDes[i] = clamp(-P.gainAtt * err[i], -P.rate[i], P.rate[i]);
        let ad = clamp((omegaDes[i] - s.omega[i]) / P.tauRate, -P.acc[i], P.acc[i]);
        if (i === 0) ad += s.turb.p * s.turb.intensity * s.turb.intensity * 0.18 + stallDepth * 0.6 * s.rand.gauss();
        if (i === 1) ad += s.turb.r * s.turb.intensity * s.turb.intensity * 0.08;
        alphaDot[i] = ad;
      }
      // integrate
      for (let i = 0; i < 3; i++) s.omega[i] += alphaDot[i] * dt;
      const wn = norm(s.omega);
      if (wn > 1e-9) s.q = qnorm(qmul(q, qaxis(scale(s.omega, 1 / wn), wn * dt)));
      s.vel = add(s.vel, scale(aW, dt));
      s.pos = add(s.pos, scale(s.vel, dt));
      s.alphaDot = alphaDot;
      // the specific force at the centre of mass, body frame: what a seat there pushes with
      const aB = qinv(s.q, aW), gB = qinv(s.q, [0, -G, 0]);
      s.fcg = sub(aB, gB);
      const i = s.info;
      i.V = V; i.ias = ias; i.mach = mach; i.alpha = alpha; i.beta = beta; i.CL = CL;
      i.n = s.fcg[1] / G; i.ny = s.fcg[2] / G; i.nx = s.fcg[0] / G;
      i.pitch = eul.pitch; i.roll = eul.roll; i.heading = eul.heading;
      i.gamma = Math.asin(clamp(s.vel[1] / Math.max(1, norm(s.vel)), -1, 1));
      i.stall = stallDepth; i.overspeed = over; i.gustW = g.w; i.gustV = g.v;
      i.turnRate = turnRate;
      // the min and max load since the last reset of the memory
      if (i.n < i.nMin) i.nMin = i.n; if (i.n > i.nMax) i.nMax = i.n;
    }

    // the specific force at a point r of the cabin (body frame): f = f_cg + ω̇×r + ω×(ω×r).
    // A free body there accelerates at -f (relative to the cabin), less the Coriolis term 2ω×v.
    function specificForce(s, r, out) {
      const w = s.omega, ad = s.alphaDot;
      const wxr = cross(w, r), wxwxr = cross(w, wxr), adxr = cross(ad, r);
      out[0] = s.fcg[0] + adxr[0] + wxwxr[0]; out[1] = s.fcg[1] + adxr[1] + wxwxr[1]; out[2] = s.fcg[2] + adxr[2] + wxwxr[2];
      return out;
    }

    // ---------------------------------------------------------- the cabin: layout
    const C = P.cabin;
    const rowX = (i) => C.row0x - i * C.pitch;
    const FLOOR = C.floor, PAN = C.floor + C.seatPan, TRAY = C.floor + C.tray, BIN = C.floor + C.binBottom, CEIL = C.floor + C.height;
    const SHELF = BIN + 0.05, BINTOP = CEIL - 0.05, BINDOOR = 0.55, BINWALL = C.halfW - 0.1;
    const LAV_X = C.xRear + 1.0, GALLEY_F = C.xFront - 0.9, GALLEY_R = C.xRear + 1.0;

    function createState(seed = 7) {
      const rand = rng(seed);
      const s = {
        t: 0, rand,
        q: qfromEuler(Math.PI / 2, 0, 0), omega: [0, 0, 0], alphaDot: [0, 0, 0],
        vel: [P.V0, 0, 0], pos: [0, P.alt, 0], psiRef: Math.PI / 2,
        fcg: [0, G, 0],
        cmd: { pitch: 0, roll: 0, yaw: 0 },
        jolts: [],
        turb: { intensity: 0, w: 0, v: 0, w1: 0, w2: 0, v1: 0, v2: 0, c1: 0, c2: 0, p: 0, r: 0 },
        beltSign: false, signT: 0,
        info: { V: P.V0, n: 1, ny: 0, nx: 0, nMin: 1, nMax: 1 },
        events: { headHits: 0, falls: 0, spills: 0, cupsDown: 0, bagsOut: 0, binsOpen: 0, thuds: 0 },
        pax: [], cups: [], bins: [], bags: [], drops: [],
        cart: { x: GALLEY_R + 0.9, vx: 0, y: 0, vy: 0, brake: true, parked: true, loose: false },
        attendant: null,
      };
      // trim: thrust equals drag in level flight at V0; the pitch that carries the weight
      const qbar = 0.5 * P.rho * P.V0 * P.V0;
      const CL = P.mass * G / (qbar * P.S);
      const alpha0 = (CL - P.CL0) / P.CLa;
      P.thrust = (P.CD0 + P.k * CL * CL) * qbar * P.S;
      P.alphaTrim = alpha0;
      s.cmd.pitch = alpha0; s.trimPitch = alpha0;
      s.q = qfromEuler(Math.PI / 2, alpha0, 0);
      // passengers: a full-ish cabin
      for (let r = 0; r < C.rows; r++) for (let k = 0; k < 6; k++) {
        if (rand() > 0.86) continue;
        const p = {
          id: s.pax.length, row: r, seat: k, x: rowX(r), z: C.seatZ[k], col: rand.int(8), size: rand.range(0.9, 1.1),
          mode: 'seated', belt: true, wants: 'sit', y: 0, vy: 0, sway: [0, 0], swayV: [0, 0],
          px: 0, tx: 0, lean: [0, 0], grab: false, crouch: 0,
          p: [0, 0, 0], v: [0, 0, 0], timer: rand.range(3, 40), hit: 0, obedient: rand() > 0.08,
        };
        s.pax.push(p);
      }
      // a few are already up, a third have the belt off
      for (const p of s.pax) if (rand() < 0.33) p.belt = false;
      // the attendant, with the cart, at the forward galley
      s.attendant = { id: -1, row: -1, seat: -1, x: GALLEY_R, z: 0, col: 8, size: 1, mode: 'standing', belt: false, wants: 'serve', y: 0, vy: 0, sway: [0, 0], swayV: [0, 0], px: GALLEY_R + 0.9 - 0.9, tx: GALLEY_R, lean: [0, 0], grab: false, crouch: 0, p: [0, 0, 0], v: [0, 0, 0], timer: 2, hit: 0, obedient: true, serving: 1, stopT: 3 };
      // cups on the trays of a third of the seated
      for (const p of s.pax) {
        if (rand() > 0.36) continue;
        s.cups.push({ owner: p.id, x: p.x + C.pitch - 0.45, z: p.z, p: [rand.range(-0.08, 0.08), rand.range(-0.05, 0.05)], v: [0, 0], fill: rand.range(0.45, 0.9), slosh: [0, 0], sloshV: [0, 0], mode: 'tray', spill: 0, stain: 0, p3: [0, 0, 0], v3: [0, 0, 0], kind: rand.int(3) });
      }
      // the bins, two rows each, a side each; a tenth are not quite latched; one or two bags in each
      for (let side = -1; side <= 1; side += 2) for (let i = 0; i < C.rows; i += 2) {
        const x = (rowX(i) + rowX(Math.min(i + 1, C.rows - 1))) / 2, len = 2 * C.pitch - 0.04;
        const b = { side, x, len, latched: rand() > 0.12, open: 0, bags: [] };
        s.bins.push(b);
        const n = 1 + (rand() < 0.6 ? 1 : 0);
        for (let j = 0; j < n; j++) {
          const w = rand.range(0.4, 0.55), h = rand.range(0.22, 0.32), d = rand.range(0.3, 0.4);
          const bag = { bin: s.bins.length - 1, size: [w, h, d], p: [x + (j - (n - 1) / 2) * 0.62 + rand.range(-0.05, 0.05), SHELF + h / 2, side * (BINDOOR + d / 2 + rand.range(0.05, 0.5))], v: [0, 0, 0], mode: 'bin', col: rand.int(5) };
          s.bags.push(bag); b.bags.push(s.bags.length - 1);
        }
      }
      stepCabinBehaviour(s, 0);
      return s;
    }

    // ---------------------------------------------------------- the cabin: who is doing what
    // The seat-belt sign is the one lever the god has over the people. Lit,
    // the walkers go back to their rows and sit, the seated buckle up (most
    // of them: a few always ignore it), the attendant parks the cart and
    // straps in. Off, a third unbuckle, up to four are up and about at a time
    // — to the lavatory at the back and home again — and the attendant works
    // the aisle with the cart, a few rows at a time.
    function stepCabinBehaviour(s, dt) {
      const walking = s.pax.filter((p) => p.mode !== 'seated').length;
      for (const p of s.pax) {
        p.timer -= dt;
        if (s.beltSign) {
          if (p.mode === 'seated' && !p.belt && p.timer <= 0) { if (p.obedient) p.belt = true; p.timer = s.rand.range(4, 12); }
          if (p.mode === 'standing' || p.mode === 'walking') p.wants = 'sit';
        } else {
          if (p.mode === 'seated' && p.timer <= 0) {
            p.timer = s.rand.range(8, 40);
            if (p.belt && s.rand() < 0.35) p.belt = false;
            else if (walking < 4 && s.rand() < 0.25 && !s.cart.loose) { p.wants = 'walk'; p.tx = LAV_X; p.mode = 'standing'; p.px = p.x; p.belt = false; p.y = 0; p.lean = [0, 0]; p.timer = s.rand.range(4, 9); }
          }
          if ((p.mode === 'standing' || p.mode === 'walking') && p.wants === 'walk' && Math.abs(p.px - p.tx) < 0.2) {
            if (p.timer <= 0) { p.wants = 'sit'; p.tx = p.x; }
          }
        }
        if ((p.mode === 'standing' || p.mode === 'walking') && p.wants === 'sit') {
          p.tx = p.x;
          if (Math.abs(p.px - p.x) < 0.2) { p.mode = 'seated'; p.y = 0; p.vy = 0; p.sway = [0, 0]; p.swayV = [0, 0]; p.timer = s.rand.range(2, 6); }
        }
      }
      // the attendant's day
      const a = s.attendant, cart = s.cart;
      a.timer -= dt;
      if (s.beltSign) {
        a.wants = 'park'; cart.brake = true;
        const home = GALLEY_R + 0.9;
        if (a.mode === 'standing' || a.mode === 'walking') {
          a.tx = Math.abs(cart.x - home) < 0.3 ? GALLEY_R : cart.x + 0.9;
          if (Math.abs(cart.x - home) > 0.3 && Math.abs(a.px - (cart.x + 0.9)) < 0.3 && !cart.loose) { cart.brake = false; cart.pushed = -1; } else cart.pushed = 0;
          if (Math.abs(cart.x - home) < 0.3 && Math.abs(a.px - GALLEY_R) < 0.35) a.mode = 'strapped';
        }
      } else {
        if (a.mode === 'strapped') { a.mode = 'standing'; a.px = GALLEY_R; }
        if (a.mode === 'standing' || a.mode === 'walking') {
          if (!cart.loose) {
            if (a.stopT > 0) { a.stopT -= dt; cart.brake = true; cart.pushed = 0; a.tx = cart.x - 0.9 * (a.serving || 1); }
            else {
              const dir = a.serving || 1;
              const goal = a.goal || (a.goal = cart.x + dir * 3 * C.pitch);
              if (dir < 0 && goal < GALLEY_R + 1.5) a.goal = GALLEY_R + 1.5;
              if (dir > 0 && goal > GALLEY_F - 1.6) a.goal = GALLEY_F - 1.6;
              a.tx = cart.x - 0.9 * dir; cart.brake = false; cart.pushed = dir;
              if (Math.abs(cart.x - a.goal) < 0.15) { a.stopT = s.rand.range(5, 9); a.goal = null; if (a.goal === null && ((dir < 0 && cart.x < GALLEY_R + 1.6) || (dir > 0 && cart.x > GALLEY_F - 1.7))) a.serving = -dir; }
            }
          } else { a.tx = a.px; cart.pushed = 0; }
        }
      }
    }

    // ---------------------------------------------------------- the cabin: bodies
    const F = [0, 0, 0], R = [0, 0, 0];
    // what a free body at r feels, as its acceleration relative to the cabin
    function relAcc(s, x, y, z) { R[0] = x; R[1] = y; R[2] = z; specificForce(s, R, F); return [-F[0], -F[1], -F[2]]; }
    // the walls a loose thing of radius r at (x, z) meets
    function boundsAt(x, z, r) {
      const overSeats = Math.abs(z) > C.aisleHalf + 0.1;
      return {
        yMin: (overSeats ? FLOOR + C.seatTop - 0.25 : FLOOR) + r,
        yMax: (Math.abs(z) > 0.42 ? BIN : CEIL) - r,
        zMax: C.halfW - 0.15 - r, xMin: C.xRear + 0.4 + r, xMax: C.xFront - 0.4 + r,
      };
    }
    // a particle against the cabin: returns the impact speed on the ceiling, floor or walls this step
    function freeBody(s, p, v, r, dt, e = 0.15) {
      const a = relAcc(s, p[0], p[1], p[2]);
      const cor = cross(s.omega, v);
      v[0] += (a[0] - 2 * cor[0]) * dt; v[1] += (a[1] - 2 * cor[1]) * dt; v[2] += (a[2] - 2 * cor[2]) * dt;
      p[0] += v[0] * dt; p[1] += v[1] * dt; p[2] += v[2] * dt;
      const b = boundsAt(p[0], p[2], r);
      let hitUp = 0, hitDown = 0, hitSide = 0;
      if (p[1] > b.yMax) { p[1] = b.yMax; if (v[1] > 0) { hitUp = v[1]; v[1] = -e * v[1]; v[0] *= 0.7; v[2] *= 0.7; } }
      if (p[1] < b.yMin) { p[1] = b.yMin; if (v[1] < 0) { hitDown = -v[1]; v[1] = -e * v[1]; v[0] *= 0.6; v[2] *= 0.6; } }
      if (p[2] > b.zMax) { p[2] = b.zMax; if (v[2] > 0) { hitSide = v[2]; v[2] = -e * v[2]; } }
      if (p[2] < -b.zMax) { p[2] = -b.zMax; if (v[2] < 0) { hitSide = -v[2]; v[2] = -e * v[2]; } }
      if (p[0] > b.xMax) { p[0] = b.xMax; if (v[0] > 0) { hitSide = Math.max(hitSide, v[0]); v[0] = -e * v[0]; } }
      if (p[0] < b.xMin) { p[0] = b.xMin; if (v[0] < 0) { hitSide = Math.max(hitSide, -v[0]); v[0] = -e * v[0]; } }
      // resting contact: static friction holds it still under anything less than 0.4 of the load; sliding, it slows
      const resting = Math.abs(p[1] - b.yMin) < 1e-6 && Math.abs(v[1]) < 0.05;
      if (resting) {
        v[1] = 0;
        const down = -a[1], ah = Math.hypot(a[0], a[2]), sp = Math.hypot(v[0], v[2]);
        if (sp < 0.03 && ah < 0.4 * down) { v[0] = 0; v[2] = 0; }
        else { const f = Math.max(0, 1 - Math.min(1, 0.3 * down * dt / Math.max(sp, 1e-3))); v[0] *= f; v[2] *= f; }
      }
      return { hitUp, hitDown, hitSide, resting: resting && Math.hypot(v[0], v[2]) < 0.03 };
    }

    // A seated passenger: the seat pushes up as long as the load is downward.
    // When it isn't — a downdraft, a push-over — the body rises off the pan:
    // five centimetres into the belt, or until the head finds the bin.
    // Above the hips the torso sways as a damped spring on the horizontal
    // specific force, stopped by the seat back and the armrests.
    function stepSeated(s, p, dt) {
      const a = relAcc(s, p.x, PAN + 0.45 + p.y, p.z);
      const down = -a[1];
      if (p.y <= 0 && down >= 0) { p.y = 0; p.vy = 0; }
      else {
        p.vy += a[1] * dt; p.y += p.vy * dt;
        if (p.belt) { if (p.y > 0.05) { p.y = 0.05; if (p.vy > 0) p.vy = 0; } }
        else {
          const top = PAN + p.y + 0.95 * p.size, lid = BIN;
          if (top > lid && p.vy > 0) { p.y -= top - lid; if (p.vy > 0.6) { s.events.headHits++; p.hit = 1; } p.vy = -0.15 * p.vy; }
        }
        if (p.y <= 0) { p.y = 0; if (p.vy < -1.2) s.events.thuds++; p.vy = 0; }
      }
      const w0 = 7.5, z = 0.55, k = p.belt ? 0.42 : 0.6;
      for (let i = 0; i < 2; i++) {
        const ah = i === 0 ? a[0] : a[2];
        p.swayV[i] += (k * ah - w0 * w0 * p.sway[i] - 2 * z * w0 * p.swayV[i]) * dt;
        p.sway[i] += p.swayV[i] * dt;
      }
      const lim = p.belt ? 0.3 : 0.42;
      if (p.sway[0] > lim) { p.sway[0] = lim; p.swayV[0] = Math.min(0, p.swayV[0]); }
      if (p.sway[0] < -0.07) { p.sway[0] = -0.07; p.swayV[0] = Math.max(0, p.swayV[0]); }
      if (p.sway[1] > 0.26) { p.sway[1] = 0.26; p.swayV[1] = Math.min(0, p.swayV[1]); }
      if (p.sway[1] < -0.26) { p.sway[1] = -0.26; p.swayV[1] = Math.max(0, p.swayV[1]); }
      if (p.hit > 0) p.hit = Math.max(0, p.hit - dt * 0.6);
    }

    // Someone on their feet in the aisle is an inverted pendulum with a
    // balance loop: they lean into whatever the floor is doing, a quarter
    // of a second late. A push the loop cannot keep up with puts them on
    // the floor; a floor that stops pushing up puts them on the ceiling.
    // Past a tenth of a g they stop and grab a seat back, which buys them
    // twice the margin; past 1.4 g the knees go.
    function stepStanding(s, p, dt, cart) {
      const a = relAcc(s, p.px, FLOOR + 1.0, 0);
      const down = -a[1];
      if (down < 2.0) { // the floor is falling away: airborne
        p.mode = 'free'; p.p = [p.px, FLOOR + 1.0, 0]; p.v = [0, 0, 0]; p.timer = 0; s.events.falls++; return;
      }
      const req = [a[0] / down, a[2] / down];
      const mag = Math.hypot(req[0], req[1]);
      p.grab = mag > 0.1 || (p.id === -1 && !cart.loose);
      const tau = 0.25;
      for (let i = 0; i < 2; i++) p.lean[i] += (req[i] - p.lean[i]) * Math.min(1, dt / tau);
      const ex = req[0] - p.lean[0], ez = req[1] - p.lean[1];
      const thresh = (p.grab ? 0.42 : 0.22) * (p.mode === 'strapped' ? 4 : 1);
      if (Math.hypot(ex / 1.3, ez) > thresh) {
        p.mode = 'free'; p.p = [p.px, FLOOR + 1.0, 0]; p.v = [1.5 * ex / (Math.hypot(ex, ez) || 1), 0.3, 1.5 * ez / (Math.hypot(ex, ez) || 1)]; p.timer = 0; s.events.falls++; return;
      }
      p.crouch = clamp((down - 13) / 7, 0, 1);

    const orbit = { az: 2.45, el: 0.22, dist: 56 };
    const look = { yaw: 0, pitch: -0.06 };
    const head = { s: [0, 0], v: [0, 0], y: 0, vy: 0 };
    const OBS = [A.GALLEY_F + 0.45, A.FLOOR + 1.55, 0];
    const _F = [0, 0, 0];
    function updateCamera(s, dt) {
      if (sim.cabinView) {
        if (camera.parent !== aircraft) { scene.remove(camera); aircraft.add(camera); }
        // the observer stands at the front of the aisle holding on, head on a spring to the floor's doings
        A.specificForce(s, OBS, _F);
        const ax = -_F[0], az = -_F[2], down = -(-_F[1]);
        const w0 = 9.0, z = 0.65, k = 0.03;
        head.v[0] += (k * ax - w0 * w0 * head.s[0] - 2 * z * w0 * head.v[0]) * dt; head.s[0] += head.v[0] * dt;
        head.v[1] += (k * az - w0 * w0 * head.s[1] - 2 * z * w0 * head.v[1]) * dt; head.s[1] += head.v[1] * dt;
        const yT = -0.012 * (down / A.G - 1);
        head.vy += ((yT - head.y) * 60 - 2 * 0.7 * Math.sqrt(60) * head.vy) * dt; head.y += head.vy * dt;
        camera.position.set(OBS[0] + head.s[0], OBS[1] + head.y, OBS[2] + head.s[1]);
        // looking aft down the aisle, with the user's own look laid on
        _E.set(0, Math.PI / 2 + look.yaw, 0, 'YXZ'); _Q.setFromEuler(_E);
        camera.quaternion.copy(_Q).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), look.pitch - 0.04 * head.s[0]));
        camera.fov = 80;
      } else {
        if (camera.parent !== scene) { aircraft.remove(camera); scene.add(camera); }
        const ce = Math.cos(orbit.el), x = Math.cos(orbit.az) * ce * orbit.dist, z = Math.sin(orbit.az) * ce * orbit.dist, y = Math.sin(orbit.el) * orbit.dist;
        camera.position.set(x, y, z); camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0);
        camera.fov = 60;
      }
      camera.updateProjectionMatrix();
    }
    function applyView() {
      interior.visible = sim.cabinView;
      for (const l of cabinLights) l.intensity = sim.cabinView ? 5 : 0;
      cabinAmbient.intensity = sim.cabinView ? 0.7 : 0;
      hemi.intensity = sim.cabinView ? 0.5 : 0.9;
      sun.intensity = sim.cabinView ? 0.9 : 2.6;
      scene.fog.density = sim.cabinView ? 0.00004 : 0.000055;
      // the fuselage is seen from inside only through the windows: its skin faces out, so it is already invisible from within
      $('#icoView').innerHTML = sim.cabinView
        ? '<path d="M5 20V10a3 3 0 0 1 3-3h2v8h9v5"/><path d="M7 15h12"/><circle cx="16.5" cy="5.5" r="1.8"/><path d="M14 20v-6h5"/>'
        : '<path d="M2.5 16.5 10 13V5.5a2 2 0 0 1 4 0V13l7.5 3.5V19L14 17.5V20l2 1.5V23l-4-1-4 1v-1.5l2-1.5v-2.5L2.5 19z"/>';
      settings.camera = sim.cabinView ? 'cabin' : 'outside'; saveSettings();
    }

    // ------------------------------------------------------------ the instruments
    const flash = { red: 0, amber: 0 };
    let lastHits = 0, lastFalls = 0;
    function drawHud(s, dt) {
      const dpr = hud.width / hud.getBoundingClientRect().width || 1;
      const W = hud.width / dpr, Hh = hud.height / dpr, g = hctx;
      g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, Hh);
      const i = s.info, small = W < 560;
      const R = small ? 44 : 60, m = small ? 10 : 16, topPad = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top')) || 0) + 54;
      // the extremes of the load, slowly forgotten
      i.nMin += (i.n - i.nMin) * Math.min(1, dt / 9); i.nMax += (i.n - i.nMax) * Math.min(1, dt / 9);
      // ---- attitude indicator
      const cx = m + R, cy = topPad + R;
      g.save(); g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
      g.translate(cx, cy); g.rotate(-i.roll);
      const ppd = R / 32; // pixels per degree of pitch
      const dy = i.pitch * R2D * ppd;
      g.fillStyle = '#3e7ed6'; g.fillRect(-3 * R, -3 * R + dy, 6 * R, 3 * R);
      g.fillStyle = '#8a5a2b'; g.fillRect(-3 * R, dy, 6 * R, 3 * R);
      g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-3 * R, dy); g.lineTo(3 * R, dy); g.stroke();
      g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,0.85)';
      for (let d = -40; d <= 40; d += 10) { if (!d) continue; const y = dy - d * ppd, w = R * 0.3; g.beginPath(); g.moveTo(-w, y); g.lineTo(w, y); g.stroke(); }
      for (let d = -35; d <= 35; d += 10) { const y = dy - d * ppd, w = R * 0.14; g.beginPath(); g.moveTo(-w, y); g.lineTo(w, y); g.stroke(); }
      // where the god wants the nose: a hollow chevron
      const cdy = dy - s.cmd.pitch * R2D * ppd;
      g.save(); g.rotate(i.roll - s.cmd.roll); g.strokeStyle = '#ff4fd8'; g.lineWidth = 2; g.beginPath(); g.moveTo(-R * 0.42, cdy + 6); g.lineTo(-R * 0.2, cdy); g.lineTo(0, cdy + 6); g.lineTo(R * 0.2, cdy); g.lineTo(R * 0.42, cdy + 6); g.stroke(); g.restore();
      g.restore();
      // the bank scale, the pointer and the fixed aeroplane
      g.save(); g.translate(cx, cy); g.strokeStyle = '#fff'; g.lineWidth = 2;
      for (const d of [0, 10, 20, 30, 45, 60]) for (const sgn of d ? [-1, 1] : [1]) { const a = -Math.PI / 2 + sgn * d * D2R, L = d % 30 === 0 ? 10 : 6; g.beginPath(); g.moveTo(Math.cos(a) * (R - 1), Math.sin(a) * (R - 1)); g.lineTo(Math.cos(a) * (R - 1 - L), Math.sin(a) * (R - 1 - L)); g.stroke(); }
      g.save(); g.rotate(-i.roll); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(0, -R + 2); g.lineTo(-6, -R + 13); g.lineTo(6, -R + 13); g.closePath(); g.fill(); g.restore();
      g.save(); g.rotate(-s.cmd.roll); g.strokeStyle = '#ff4fd8'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, -R + 1); g.lineTo(-6, -R - 9); g.lineTo(6, -R - 9); g.closePath(); g.stroke(); g.restore();
      g.strokeStyle = '#ffd33d'; g.lineWidth = 3; g.beginPath(); g.moveTo(-R * 0.6, 0); g.lineTo(-R * 0.22, 0); g.lineTo(-R * 0.12, R * 0.12); g.lineTo(0, 0); g.lineTo(R * 0.12, R * 0.12); g.lineTo(R * 0.22, 0); g.lineTo(R * 0.6, 0); g.stroke();
      g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 2; g.stroke();
      g.restore();
      // the slip ball under it: a free mass in a curved tube
      {
        const by = cy + R + 14, bw = R * 0.9;
        g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.roundRect(cx - bw, by - 8, bw * 2, 16, 8); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx - 7, by - 8); g.lineTo(cx - 7, by + 8); g.moveTo(cx + 7, by - 8); g.lineTo(cx + 7, by + 8); g.stroke();
        const off = clamp(-i.ny * 180, -bw + 8, bw - 8);
        g.fillStyle = Math.abs(off) > 7 ? '#ffd33d' : '#fff'; g.beginPath(); g.arc(cx + off, by, 6, 0, Math.PI * 2); g.fill();
      }
      // ---- airspeed: a tape with the green band and the barber pole; the pointer is the indicated speed
      {
        const tx = cx + R + 16, ty = topPad, th = R * 2 + 30, tw = small ? 10 : 14;
        const vmax = 420 * A.KT, yOf = (v) => ty + th - clamp(v / vmax, 0, 1) * th;
        const vs = Math.sqrt(2 * A.P.mass * A.G / (A.P.rho0 * A.P.S * (A.P.CL0 + A.P.CLa * A.P.aStall)));
        g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(tx, ty, tw, th);
        g.fillStyle = '#f85149'; g.fillRect(tx, yOf(vs * 1.0), tw, yOf(0) - yOf(vs * 1.0));
        g.fillStyle = '#e3b341'; g.fillRect(tx, yOf(vs * 1.25), tw, yOf(vs * 1.0) - yOf(vs * 1.25));
        g.fillStyle = '#3fb950'; g.fillRect(tx, yOf(A.P.Vmo), tw, yOf(vs * 1.25) - yOf(A.P.Vmo));
        g.save(); g.beginPath(); g.rect(tx, yOf(vmax), tw, yOf(A.P.Vmo) - yOf(vmax)); g.clip();
        for (let y = yOf(vmax) - 8; y < yOf(A.P.Vmo) + 8; y += 8) { g.fillStyle = '#f85149'; g.fillRect(tx, y, tw, 4); g.fillStyle = '#fff'; g.fillRect(tx, y + 4, tw, 4); }
        g.restore();
        const py = yOf(i.ias), warn = i.stall > 0 || i.overspeed > 0;
        g.fillStyle = warn && Math.floor(s.t * 6) % 2 ? '#f85149' : '#fff';
        g.beginPath(); g.moveTo(tx + tw + 2, py); g.lineTo(tx + tw + 12, py - 7); g.lineTo(tx + tw + 12, py + 7); g.closePath(); g.fill();
        g.fillRect(tx - 2, py - 1.5, tw + 4, 3);
      }
      // ---- the g meter, top right: −1 to +3, a 270° sweep; the needle, and the recent extremes
      {
        const gx = W - m - R, gy = topPad + R, a0 = Math.PI * 0.75, span = Math.PI * 1.5, ang = (n) => a0 + clamp((n + 1) / 4, 0, 1) * span;
        const band = (n1, n2, col) => { g.strokeStyle = col; g.lineWidth = 9; g.beginPath(); g.arc(gx, gy, R - 6, ang(n1), ang(n2)); g.stroke(); };
        g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.arc(gx, gy, R, 0, Math.PI * 2); g.fill();
        band(-1, 0.3, '#f85149'); band(0.3, 0.8, '#e3b341'); band(0.8, 1.3, '#3fb950'); band(1.3, 2.0, '#e3b341'); band(2.0, 3, '#f85149');
        g.strokeStyle = '#fff'; g.lineWidth = 2;
        for (let n = -1; n <= 3; n += 0.5) { const a = ang(n), L = Number.isInteger(n) ? 9 : 5; g.beginPath(); g.moveTo(gx + Math.cos(a) * (R - 12), gy + Math.sin(a) * (R - 12)); g.lineTo(gx + Math.cos(a) * (R - 12 - L), gy + Math.sin(a) * (R - 12 - L)); g.stroke(); }
        g.fillStyle = '#fff'; { const a = ang(1); g.beginPath(); g.arc(gx + Math.cos(a) * (R - 26), gy + Math.sin(a) * (R - 26), 3, 0, Math.PI * 2); g.fill(); }
        for (const [n, col] of [[i.nMin, '#58a6ff'], [i.nMax, '#ff7b72']]) { const a = ang(n); g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.moveTo(gx + Math.cos(a) * (R - 2), gy + Math.sin(a) * (R - 2)); g.lineTo(gx + Math.cos(a) * (R - 11), gy + Math.sin(a) * (R - 11)); g.stroke(); }
        const a = ang(i.n); g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(gx - Math.cos(a) * 8, gy - Math.sin(a) * 8); g.lineTo(gx + Math.cos(a) * (R - 14), gy + Math.sin(a) * (R - 14)); g.stroke();
        g.fillStyle = '#e6edf3'; g.beginPath(); g.arc(gx, gy, 5, 0, Math.PI * 2); g.fill();
      }
      // a flash at the edges when a head meets the ceiling, or someone goes down
      if (s.events.headHits > lastHits) flash.red = 1; if (s.events.falls > lastFalls) flash.amber = Math.max(flash.amber, 0.7);
      lastHits = s.events.headHits; lastFalls = s.events.falls;
      for (const [key, col] of [['red', '248,81,73'], ['amber', '227,179,65']]) {
        if (flash[key] <= 0) continue;
        const grd = g.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.35, W / 2, Hh / 2, Math.max(W, Hh) * 0.75);
        grd.addColorStop(0, `rgba(${col},0)`); grd.addColorStop(1, `rgba(${col},${0.55 * flash[key]})`);
        g.fillStyle = grd; g.fillRect(0, 0, W, Hh);
        flash[key] = Math.max(0, flash[key] - dt * 2.2);
      }
    }

    // ------------------------------------------------------------ the god's panel
    const padAtt = $('#padAtt'), padYaw = $('#padYaw');
    const knobs = { att: padAtt.querySelector('.knob'), yaw: padYaw.querySelector('.knob') };
    const padVal = { att: [0, 0], yaw: [0, 0] }; // −1..1 each axis; stays where it is left
    function placeKnob(which) {
      const pad = which === 'att' ? padAtt : padYaw, v = padVal[which], r = pad.getBoundingClientRect();
      knobs[which].style.left = `${50 + v[0] * 42}%`; knobs[which].style.top = `${50 - v[1] * 42}%`;
      void r;
    }
    function applyPads() {
      const s = sim.state, maxA = A.P.maxAngle;
      // the attitude pad: up is nose up, right is right wing down; the yaw pad: right is nose right, up is rougher air
      A.command(s, s.trimPitch + padVal.att[1] * maxA, padVal.att[0] * maxA, padVal.yaw[0] * maxA);
      sim.turbLevel = clamp((padVal.yaw[1] + 1) / 2, 0, 1);
      if (sim.turbLevel > 0.02 && !sim.turbOn) { sim.turbOn = true; refreshButtons(); }
      if (sim.turbLevel <= 0.02 && sim.turbOn) { sim.turbOn = false; refreshButtons(); }
      s.turb.intensity = sim.turbOn ? sim.turbLevel : 0;
    }
    function setupPad(which, pad) {
      let active = null, lastTap = 0;
      const set = (ev) => {
        const r = pad.getBoundingClientRect();
        const x = clamp(((ev.clientX - r.left) / r.width - 0.5) / 0.42, -1, 1), y = clamp(-((ev.clientY - r.top) / r.height - 0.5) / 0.42, -1, 1);
        padVal[which][0] = Math.abs(x) < 0.06 ? 0 : x; padVal[which][1] = Math.abs(y) < 0.06 ? 0 : y;
        placeKnob(which); applyPads();
      };
      pad.addEventListener('pointerdown', (ev) => {
        if (active !== null) return; active = ev.pointerId; pad.setPointerCapture(ev.pointerId);
        const now = performance.now();
        if (now - lastTap < 300) { padVal[which] = [0, which === 'yaw' ? -1 : 0]; placeKnob(which); applyPads(); active = null; return; }
        lastTap = now; set(ev);
      });
      pad.addEventListener('pointermove', (ev) => { if (ev.pointerId === active) set(ev); });
      const end = (ev) => { if (ev.pointerId === active) active = null; };
      pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
    }
    setupPad('att', padAtt); setupPad('yaw', padYaw);
    padVal.yaw[1] = -1; placeKnob('att'); placeKnob('yaw');

    function refreshButtons() {
      $('#btnBelt').classList.toggle('on', sim.state.beltSign);
      $('#btnTurb').classList.toggle('on', sim.turbOn);
      $('#btnBelt').setAttribute('aria-pressed', String(sim.state.beltSign));
      $('#btnTurb').setAttribute('aria-pressed', String(sim.turbOn));
    }
    const pulse = (id) => { const b = $(id); b.classList.add('pulse'); setTimeout(() => b.classList.remove('pulse'), 350); };
    function doLevel() { padVal.att = [0, 0]; padVal.yaw[0] = 0; placeKnob('att'); placeKnob('yaw'); applyPads(); A.levelOff(sim.state); }
    let levelTap = 0;
    $('#btnLevel').addEventListener('click', () => { const now = performance.now(); if (now - levelTap < 350) { A.resetFlight(sim.state); head.s = [0, 0]; head.v = [0, 0]; } levelTap = now; doLevel(); });
    $('#btnBelt').addEventListener('click', () => { sim.state.beltSign = !sim.state.beltSign; refreshButtons(); });
    $('#btnTurb').addEventListener('click', () => {
      sim.turbOn = !sim.turbOn;
      if (sim.turbOn && sim.turbLevel <= 0.02) { padVal.yaw[1] = 0.0; placeKnob('yaw'); }
      if (!sim.turbOn) { padVal.yaw[1] = -1; placeKnob('yaw'); }
      applyPads(); refreshButtons();
    });
    $('#btnJolt1').addEventListener('click', () => { A.jolt(sim.state, -9); pulse('#btnJolt1'); });
    $('#btnJolt2').addEventListener('click', () => { A.jolt(sim.state, -30); pulse('#btnJolt2'); });
    $('#btnJolt3').addEventListener('click', () => { A.jolt(sim.state, 15); pulse('#btnJolt3'); });
    $('#btnView').addEventListener('click', () => { sim.cabinView = !sim.cabinView; applyView(); });
    $('#btnRecenter').addEventListener('click', () => { look.yaw = 0; look.pitch = -0.06; orbit.az = 2.45; orbit.el = 0.22; orbit.dist = 56; });
    for (const b of document.querySelectorAll('button')) b.addEventListener('pointerup', () => b.blur());

    // keys: arrows pitch and roll, Q/E yaw, Space the big jolt, J a small one, U an updraft, T turbulence, B the sign, C the view, R level (twice to reset)
    addEventListener('keydown', (ev) => {
      if (ev.repeat && !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'q', 'e', 'Q', 'E', '+', '-', '=', '_'].includes(ev.key)) return;
      const stepA = 0.08;
      switch (ev.key) {
        case 'ArrowUp': padVal.att[1] = clamp(padVal.att[1] + stepA, -1, 1); break;
        case 'ArrowDown': padVal.att[1] = clamp(padVal.att[1] - stepA, -1, 1); break;
        case 'ArrowRight': padVal.att[0] = clamp(padVal.att[0] + stepA, -1, 1); break;
        case 'ArrowLeft': padVal.att[0] = clamp(padVal.att[0] - stepA, -1, 1); break;
        case 'q': case 'Q': padVal.yaw[0] = clamp(padVal.yaw[0] - stepA, -1, 1); break;
        case 'e': case 'E': padVal.yaw[0] = clamp(padVal.yaw[0] + stepA, -1, 1); break;
        case '+': case '=': padVal.yaw[1] = clamp(padVal.yaw[1] + 0.1, -1, 1); break;
        case '-': case '_': padVal.yaw[1] = clamp(padVal.yaw[1] - 0.1, -1, 1); break;
        case ' ': $('#btnJolt2').click(); break;
        case 'j': case 'J': $('#btnJolt1').click(); break;
        case 'u': case 'U': $('#btnJolt3').click(); break;
        case 't': case 'T': $('#btnTurb').click(); break;
        case 'b': case 'B': $('#btnBelt').click(); break;
        case 'c': case 'C': $('#btnView').click(); break;
        case 'r': case 'R': $('#btnLevel').click(); break;
        default: return;
      }
      ev.preventDefault();
      placeKnob('att'); placeKnob('yaw'); applyPads();
    });

    // ---- dragging the view: orbit outside, look around inside; wheel and pinch to zoom outside
    {
      const pts = new Map(); let pinch0 = 0, dist0 = 0;
      canvas.addEventListener('pointerdown', (ev) => { pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); canvas.setPointerCapture(ev.pointerId); canvas.classList.add('dragging'); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = orbit.dist; } });
      canvas.addEventListener('pointermove', (ev) => {
        const p = pts.get(ev.pointerId); if (!p) return;
        const dx = ev.clientX - p.x, dy = ev.clientY - p.y; p.x = ev.clientX; p.y = ev.clientY;
        if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0 > 0) orbit.dist = clamp(dist0 * pinch0 / d, 25, 400); return; }
        if (sim.cabinView) { look.yaw = clamp(look.yaw - dx * 0.004, -1.6, 1.6); look.pitch = clamp(look.pitch + dy * 0.004, -0.9, 0.9); }
        else { orbit.az -= dx * 0.006; orbit.el = clamp(orbit.el + dy * 0.006, -0.35, 1.3); }
      });
      const end = (ev) => { pts.delete(ev.pointerId); if (!pts.size) canvas.classList.remove('dragging'); };
      canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
      canvas.addEventListener('wheel', (ev) => { if (!sim.cabinView) orbit.dist = clamp(orbit.dist * Math.exp(ev.deltaY * 0.0012), 25, 400); ev.preventDefault(); }, { passive: false });
      canvas.addEventListener('dblclick', () => $('#btnRecenter').click());
    }

    // ---- sizing
    function resize() {
      const r = canvas.getBoundingClientRect();
      renderer.setSize(r.width, r.height, false);
      camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
      const dpr = Math.min(devicePixelRatio, 2);
      hud.width = Math.round(r.width * dpr); hud.height = Math.round(r.height * dpr);
      placeKnob('att'); placeKnob('yaw');
    }
    addEventListener('resize', resize);
    if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(resize, 100));

    // ---- lights on the airframe
    function updateLights(t) {
      const u = exterior.userData;
      const strobe = (t % 1.2) < 0.08 ? 1 : 0.25, beacon = 0.35 + 0.65 * Math.max(0, Math.sin(t * 2.6));
      u.tail.material.opacity = strobe; u.beacon.material.opacity = beacon; u.beaconTop.material.opacity = beacon;
    }

    // ---- the loop
    let last = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      const s = sim.state;
      sim.time += dt;
      A.step(s, dt);
      aircraft.quaternion.set(s.q[0], s.q[1], s.q[2], s.q[3]);
      updateEnvironment(s);
      if (sim.cabinView) updateCabin(s, sim.time);
      updateLights(sim.time);
      updateCamera(s, dt);
      renderer.render(scene, camera);
      drawHud(s, dt);
    }

    // ---- go
    buildEnvironment(); buildExterior(); buildInterior();
    applyView(); applyPads(); refreshButtons(); resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
